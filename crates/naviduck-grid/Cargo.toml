[package]
name = "naviduck-grid"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "Result grid and table viewer for naviduck."

[dependencies]
naviduck-session = { path = "../naviduck-session" }
naviduck-ui.workspace = true
naviduck-model.workspace = true
naviduck-app-state.workspace = true
naviduck-util.workspace = true
naviduck-sql = { path = "../naviduck-sql" }
naviduck-db.workspace = true
naviduck-schema = { path = "../naviduck-schema" }
jiff.workspace = true
anyhow.workspace = true
gpui-kit = { workspace = true, features = ["tree-sitter-sql"] }
lsp-types = "0.97"
rust-i18n.workspace = true
tracing.workspace = true
tokio.workspace = true
serde_json.workspace = true

[dev-dependencies]
naviduck-mysql = { path = "../naviduck-mysql" }
naviduck-postgres = { path = "../naviduck-postgres" }
naviduck-sqlite = { path = "../naviduck-sqlite" }
naviduck-dameng = { path = "../naviduck-dameng" }
naviduck-test-support = { path = "../naviduck-test-support" }
gpui-kit = { workspace = true, features = ["test-support"] }
