tracing.workspace = true
tokio.workspace = true
serde_json.workspace = true
serde.workspace = true
jiff.workspace = true

[dev-dependencies]
naviduck-mysql = { path = "../naviduck-mysql" }
naviduck-postgres = { path = "../naviduck-postgres" }
naviduck-sqlite = { path = "../naviduck-sqlite" }
naviduck-test-support = { path = "../naviduck-test-support" }
