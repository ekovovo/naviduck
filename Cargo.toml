[workspace]
resolver = "3"
members = ["crates/*", "xtask"]
default-members = ["crates/naviduck"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.99"
license = "Apache-2.0"
repository = "https://github.com/ekovovo/naviduck"

[workspace.dependencies]
# `version` lets `cargo publish` rewrite the path to a crates.io requirement.
# Keep it equal to workspace.package.version.
naviduck-ui = { version = "0.0.1", path = "crates/naviduck-ui" }
naviduck-model = { version = "0.0.1", path = "crates/naviduck-model" }
naviduck-app-state = { version = "0.0.1", path = "crates/naviduck-app-state" }
naviduck-util = { version = "0.0.1", path = "crates/naviduck-util" }
naviduck-db = { version = "0.0.1", path = "crates/naviduck-db" }
naviduck-connection = { version = "0.0.1", path = "crates/naviduck-connection" }
naviduck-navigator = { version = "0.0.1", path = "crates/naviduck-navigator" }
naviduck-grid = { version = "0.0.1", path = "crates/naviduck-grid" }
naviduck-designer = { version = "0.0.1", path = "crates/naviduck-designer" }
naviduck-query = { version = "0.0.1", path = "crates/naviduck-query" }

gpui-kit = { version = "0.8", features = ["gpui-fast"] }
rust-i18n = "4"
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tokio = { version = "1", features = ["rt-multi-thread", "net", "time", "sync", "macros", "io-util"] }
futures = "0.3"
uuid = { version = "1", features = ["v4"] }
jiff = "0.2"
regex = "1"
hex = "0.4"

# Recommended by the gpui-kit docs: optimize the rendering dependencies in debug builds so the UI stays smooth
[profile.dev.package.gpui-pre]
opt-level = 3
[profile.dev.package.gpui-component]
opt-level = 3
[profile.dev.package.gpui-base]
opt-level = 3
[profile.dev.package.taffy]
opt-level = 3

[profile.release]
codegen-units = 1
strip = "symbols"
lto = "fat"
opt-level = "s"
# panic = "abort"
# "s" for a smaller binary. The 2026-10-10 spike scrolled about 20% slower than opt-level 3
# (21-table-viewer.md §1); release keeps "s".

# dm-pure 1.2.4's upstream repository returns 404; the four protocol patches
# (off-row LOB, EXPLAIN cmd=149, error body layout, session-state short frame)
# live on the fix branch of the self-hosted mirror (docs/pr/acceptance-dameng.md).
# File an upstream PR once it is reachable again; switch back to a pinned
# crates.io release and drop this section when upstream publishes a fix.
[patch.crates-io]
dm-pure = { git = "https://github.com/ekovovo/dm-rs", branch = "fix/protocol-lob-explain-error-status" }
